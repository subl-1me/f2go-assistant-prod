<!-- HeaderP -->
<header class="bg-white shadow-sm p-4 sticky top-0 z-10">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Auditoría</h1>
      <p class="text-gray-600">
        Automatización de procesos para impresión de reportes de auditoría
        generados y otras utilidades.
      </p>
    </div>
  </div>
</header>

<!-- Content  -->
<main class="p-6">
  <!-- Last generated audit reports  -->
  <div class="grid grid-cols-1 gap-6 mb-8">
    <div
      class="bg-white rounded-xl shadow-md p-6 card-hover transition-all hover:transform hover:-translate-y-1"
    >
      <div class="flex items-start">
        <div
          class="p-3 rounded-full bg-purple-100 mr-4 flex-shrink-0 text-purple-600"
        >
          <i class="fas fa-not-equal text-xl"></i>
        </div>
        <div class="flex-grow">
          <h2 class="font-bold text-lg mb-1 text-purple-600">
            Reportes de Auditoría
          </h2>
          <p class="text-sm text-gray-600 mb-4">
            Presione el botón para iniciar la descarga e impresión de los
            reportes de auditoría.
          </p>

          <div class="mt-4 pt-4 border-t border-gray-100">
            <div class="flex justify-between items-center">
              <div class="text-xs text-gray-500">
                <i class="fas fa-exclamation-triangle mr-1"></i> Se imprimirán
                todos los reportes por usuario considerando el orden
                establecido.
              </div>
              <button
                (click)="onStartAuditReports()"
                class="bg-purple-600 hover:bg-purple-700 text-white py-2 px-6 rounded-xl text-sm font-medium transition-colors flex items-center"
              >
                <i class="fas fa-play mr-2"></i> Iniciar descarga e impresión
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
