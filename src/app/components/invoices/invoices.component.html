<!-- Header -->
<header class="bg-white shadow-sm p-4">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Facturaciones</h1>
      <p class="text-gray-600">
        Aquí podrás realizar facturas con la información recopilada durante las
        revisiones de las reservaciones.
      </p>
    </div>
  </div>
</header>

<!-- Content home  -->
<main class="p-6">
  <div class="grid grid-cols-1 md:grid-cols lg:grid-cols gap-6 mb-8">
    <div class="bg-white rounded-xl shadow-md p-6 card-hover transition-all">
      <div class="flex items-center cursor-pointer">
        <div class="p-3 rounded-full bg-card-icon mr-4">
          <i class="fas fa-door-open text-xl"></i>
        </div>
        <div>
          <p class="font-bold card-title">Facturas de salidas de hoy</p>
          <h3 class="text-sm">Consulta el estado de las facturas</h3>
        </div>
      </div>

      <!-- Contenido colapsable -->
      <div
        class="collapse-content mt-4 pt-4 border-t border-gray-100"
        [class.hidden]="isCurrentCardCollapsed"
      >
        <!-- check component -->
        <app-today-departures></app-today-departures>
      </div>

      <!-- Botón de expandir/colapsar -->
      <div class="mt-4 pt-4 border-t border-gray-100">
        <span
          class="card-title text-sm font-bold float-end cursor-pointer"
          (click)="toggleCurrentCardCollapse()"
          >{{ isCurrentCardCollapsed ? "Expandir" : "Colapsar" }}
          <i
            class="fas fa-arrow-down ml-1 arrow transition-transform"
            *ngIf="isCurrentCardCollapsed"
          ></i>
          <i
            class="fas fa-arrow-up ml-1 arrow transition-transform"
            *ngIf="!isCurrentCardCollapsed"
          ></i>
        </span>
      </div>
    </div>
  </div>

  <!-- Note  -->
  <!-- <div
    class="mt-4 p-4 bg-blue-50 border border-blue-200 rounded-xl text-sm text-blue-700"
  >
    <i class="fas fa-info-circle mr-2"></i> Las facturas marcadas como genéricas
    se emitirán a nombre de "PÚBLICO EN GENERAL" con RFC genérico.
  </div> -->
</main>
